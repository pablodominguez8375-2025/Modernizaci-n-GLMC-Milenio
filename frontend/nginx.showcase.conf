server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /health/web {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # El showcase usa exclusivamente datos de demostración embebidos.
    # Si una pantalla intentara consultar red por error, fallará explícitamente.
    location /api/ {
        return 503;
    }

    location /health/ {
        return 503;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
