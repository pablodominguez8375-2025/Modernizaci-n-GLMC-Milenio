services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmgm}
      POSTGRES_USER: ${POSTGRES_USER:-pmgm_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - pmgm_qa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmgm_app} -d ${POSTGRES_DB:-pmgm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pmgm_qa_internal

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY es obligatorio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY es obligatorio}
    volumes:
      - pmgm_qa_minio_data:/data
    networks:
      - pmgm_qa_internal

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY es obligatorio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY es obligatorio}
    entrypoint: >
      /bin/sh -c "
      until mc alias set pmgm http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do sleep 2; done;
      mc mb --ignore-existing pmgm/pmgm-documents;
      mc anonymous set none pmgm/pmgm-documents;
      exit 0;
      "
    networks:
      - pmgm_qa_internal

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - pmgm_qa_clamav_db:/var/lib/clamav
    networks:
      - pmgm_qa_internal

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Database__ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-true}
      Authentication__Authority: ${OIDC_AUTHORITY:-}
      Authentication__Audience: ${OIDC_API_AUDIENCE:-pmgm-api}
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-pmgm};Username=${POSTGRES_USER:-pmgm_app};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      DocumentStorage__ServiceUrl: http://minio:9000
      DocumentStorage__Region: ${S3_REGION:-us-east-1}
      DocumentStorage__Bucket: ${S3_BUCKET:-pmgm-documents}
      DocumentStorage__AccessKey: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY es obligatorio}
      DocumentStorage__SecretKey: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY es obligatorio}
      DocumentStorage__ForcePathStyle: "true"
      DocumentStorage__MaxUploadBytes: ${DOCUMENT_MAX_UPLOAD_BYTES:-52428800}
      DocumentMalware__Host: clamav
      DocumentMalware__Port: "3310"
      DocumentMalware__MaxStreamBytes: ${DOCUMENT_MAX_UPLOAD_BYTES:-52428800}
    networks:
      - pmgm_qa_internal

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_USE_MOCKS: "false"
        VITE_OIDC_AUTHORITY: ${OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
        VITE_OIDC_SCOPE: ${OIDC_SCOPE:-openid profile}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PMGM_BIND_ADDRESS:-127.0.0.1}:${PMGM_HTTP_PORT:-8081}:80"
    networks:
      - pmgm_qa_internal

networks:
  pmgm_qa_internal:
    driver: bridge

volumes:
  pmgm_qa_postgres_data:
  pmgm_qa_minio_data:
  pmgm_qa_clamav_db:
