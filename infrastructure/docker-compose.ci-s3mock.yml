services:
  minio:
    image: adobe/s3mock:5.1.0
    command: []
    environment:
      COM_ADOBE_TESTING_S3MOCK_HTTP_PORT: "9000"
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: pmgm-documents

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set pmgm http://minio:9000 $MINIO_ACCESS_KEY $MINIO_SECRET_KEY >/dev/null;
        until mc ls pmgm/pmgm-documents >/dev/null 2>&1; do sleep 2; done;
        exit 0
