services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pmgm
      POSTGRES_USER: pmgm_app
      POSTGRES_PASSWORD: ${PMGM_QA_DB_PASSWORD:?PMGM_QA_DB_PASSWORD es obligatorio}
    volumes:
      - pmgm_srv01_postgres_data:/var/lib/postgresql/data
      - ./postgres/init-srv01.sql:/docker-entrypoint-initdb.d/10-init-srv01.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmgm_app -d pmgm"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pmgm_srv01_internal]

  # QA glmdch candidate only. Vendor selection/licensing/backup acceptance are pending.
  # MinIO-compatible network alias preserved for historical script compatibility.
  minio:
    image: docker.io/pgsty/silo@sha256:aaac6bce13eb99316b3c88bd20143fc3c38ab607585256a411a095c44ee57f62
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PMGM_QA_STORAGE_ADMIN_USER:-REEMPLAZAR_STORAGE_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${PMGM_QA_STORAGE_ADMIN_PASSWORD:-REEMPLAZAR_STORAGE_ADMIN_PASSWORD}
    volumes:
      - pmgm_srv01_minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [pmgm_srv01_internal]

  # Root is used exclusively for private bucket/IAM provisioning, never by API.
  minio-init:
    image: docker.io/pgsty/silo@sha256:aaac6bce13eb99316b3c88bd20143fc3c38ab607585256a411a095c44ee57f62
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${PMGM_QA_STORAGE_ADMIN_USER:-REEMPLAZAR_STORAGE_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${PMGM_QA_STORAGE_ADMIN_PASSWORD:-REEMPLAZAR_STORAGE_ADMIN_PASSWORD}
      DOCUMENT_ACCESS_KEY: ${PMGM_QA_DOCUMENT_ACCESS_KEY:-REEMPLAZAR_DOCUMENT_ACCESS_KEY}
      DOCUMENT_SECRET_KEY: ${PMGM_QA_DOCUMENT_SECRET_KEY:-REEMPLAZAR_DOCUMENT_SECRET_KEY}
      BACKUP_ACCESS_KEY: ${PMGM_QA_BACKUP_ACCESS_KEY:-REEMPLAZAR_BACKUP_ACCESS_KEY}
      BACKUP_SECRET_KEY: ${PMGM_QA_BACKUP_SECRET_KEY:-REEMPLAZAR_BACKUP_SECRET_KEY}
    volumes:
      - ./silo/pmgm-qa-documents-policy.json:/policies/documents.json:ro
      - ../scripts/qa/qa-provision-silo.sh:/scripts/qa-provision-silo.sh:ro
    # Script avoids Compose interpolating shell variables.
    entrypoint: ["/bin/sh", "/scripts/qa-provision-silo.sh"]
    networks: [pmgm_srv01_internal]

  # On-demand client for synthetic QA backups only; receives NO administrator credentials.
  storage-backup-client:
    image: docker.io/pgsty/silo@sha256:aaac6bce13eb99316b3c88bd20143fc3c38ab607585256a411a095c44ee57f62
    profiles: ["qa-backup"]
    environment:
      BACKUP_ACCESS_KEY: ${PMGM_QA_BACKUP_ACCESS_KEY:-REEMPLAZAR_BACKUP_ACCESS_KEY}
      BACKUP_SECRET_KEY: ${PMGM_QA_BACKUP_SECRET_KEY:-REEMPLAZAR_BACKUP_SECRET_KEY}
    entrypoint: ["/bin/sh"]
    networks: [pmgm_srv01_internal]

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - pmgm_srv01_clamav_db:/var/lib/clamav
    networks: [pmgm_srv01_internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PMGM_ACCOUNT_SMTP_HOST: ${PMGM_ACCOUNT_SMTP_HOST:-}
      PMGM_ACCOUNT_SMTP_PORT: ${PMGM_ACCOUNT_SMTP_PORT:-587}
      PMGM_ACCOUNT_SMTP_USER: ${PMGM_ACCOUNT_SMTP_USER:-}
      PMGM_ACCOUNT_SMTP_PASSWORD: ${PMGM_ACCOUNT_SMTP_PASSWORD:-}
      PMGM_ACCOUNT_SMTP_FROM: ${PMGM_ACCOUNT_SMTP_FROM:-no-reply@pmgm.invalid}
      PMGM_ACCOUNT_SMTP_AUTH: ${PMGM_ACCOUNT_SMTP_AUTH:-true}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/pmgm_keycloak
      KC_DB_USERNAME: pmgm_app
      KC_DB_PASSWORD: ${PMGM_QA_DB_PASSWORD:?PMGM_QA_DB_PASSWORD es obligatorio}
      KC_BOOTSTRAP_ADMIN_USERNAME: qa-keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PMGM_QA_KEYCLOAK_ADMIN_PASSWORD:?PMGM_QA_KEYCLOAK_ADMIN_PASSWORD es obligatorio}
      PMGM_QA_USER_PASSWORD: ${PMGM_QA_USER_PASSWORD:?PMGM_QA_USER_PASSWORD es obligatorio}
      PMGM_QA_WEB_PUBLIC_URL: ${PMGM_QA_WEB_PUBLIC_URL:?PMGM_QA_WEB_PUBLIC_URL es obligatorio}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${PMGM_QA_OIDC_PUBLIC_URL:?PMGM_QA_OIDC_PUBLIC_URL es obligatorio}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "true"
    volumes:
      - ./keycloak/pmgm-realm.json:/opt/keycloak/data/import/pmgm-realm.json:ro
    ports:
      - "${PMGM_QA_BIND_ADDRESS:-127.0.0.1}:${PMGM_QA_OIDC_PORT:-8180}:8080"
    networks: [pmgm_srv01_internal]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Database__ApplyMigrationsOnStartup: "true"
      DemoData__Enabled: "true"
      UserAccounts__Identity__ServerUrl: ${PMGM_ACCOUNT_IDENTITY_URL:-}
      UserAccounts__Identity__Issuer: ${PMGM_ACCOUNT_ISSUER:-}
      UserAccounts__Identity__ClientId: ${PMGM_ACCOUNT_CLIENT_ID:-pmgm-account-admin}
      UserAccounts__Identity__ClientSecret: ${PMGM_ACCOUNT_CLIENT_SECRET:-}
      UserAccounts__Mail__Host: ${PMGM_ACCOUNT_SMTP_HOST:-}
      UserAccounts__Mail__Port: ${PMGM_ACCOUNT_SMTP_PORT:-587}
      UserAccounts__Mail__EnableSsl: "true"
      UserAccounts__Mail__Username: ${PMGM_ACCOUNT_SMTP_USER:-}
      UserAccounts__Mail__Password: ${PMGM_ACCOUNT_SMTP_PASSWORD:-}
      UserAccounts__Mail__From: ${PMGM_ACCOUNT_SMTP_FROM:-}
      UserAccounts__Mail__LoginUrl: ${PMGM_ACCOUNT_LOGIN_URL:-}
      Authentication__Authority: http://keycloak:8080/realms/pmgm
      Authentication__Audience: pmgm-api
      Authentication__RequireHttpsMetadata: "false"
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=pmgm;Username=pmgm_app;Password=${PMGM_QA_DB_PASSWORD:?PMGM_QA_DB_PASSWORD es obligatorio}
      DocumentStorage__ServiceUrl: http://minio:9000
      DocumentStorage__Region: us-east-1
      DocumentStorage__Bucket: pmgm-documents
      DocumentStorage__AccessKey: ${PMGM_QA_DOCUMENT_ACCESS_KEY:-REEMPLAZAR_DOCUMENT_ACCESS_KEY}
      DocumentStorage__SecretKey: ${PMGM_QA_DOCUMENT_SECRET_KEY:-REEMPLAZAR_DOCUMENT_SECRET_KEY}
      DocumentStorage__ForcePathStyle: "true"
      DocumentStorage__MaxUploadBytes: "52428800"
      DocumentMalware__Host: clamav
      DocumentMalware__Port: "3310"
      DocumentMalware__MaxStreamBytes: "52428800"
    networks: [pmgm_srv01_internal]

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_USE_MOCKS: "false"
        VITE_OIDC_AUTHORITY: ${PMGM_QA_OIDC_PUBLIC_URL:?PMGM_QA_OIDC_PUBLIC_URL es obligatorio}/realms/pmgm
        VITE_OIDC_CLIENT_ID: pmgm-web
        VITE_OIDC_SCOPE: openid profile
        VITE_OIDC_ALLOW_HTTP_LOCAL: "false"
        VITE_OIDC_ALLOW_HTTP_QA: "true"
    restart: unless-stopped
    depends_on: [api, keycloak]
    ports:
      - "${PMGM_QA_BIND_ADDRESS:-127.0.0.1}:${PMGM_QA_WEB_PORT:-8081}:80"
    networks: [pmgm_srv01_internal]

networks:
  pmgm_srv01_internal:
    driver: bridge

volumes:
  pmgm_srv01_postgres_data:
  pmgm_srv01_minio_data:
  pmgm_srv01_clamav_db:
