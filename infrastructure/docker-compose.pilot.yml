services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pmgm
      POSTGRES_USER: pmgm_app
      POSTGRES_PASSWORD: ${PMGM_PILOT_DB_PASSWORD:?PMGM_PILOT_DB_PASSWORD es obligatorio}
    volumes:
      - pmgm_pilot_postgres_data:/var/lib/postgresql/data
      - ./postgres/001-create-pilot-keycloak.sql:/docker-entrypoint-initdb.d/001-create-pilot-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmgm_app -d pmgm"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pmgm_pilot_internal]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PMGM_PILOT_MINIO_USER:?PMGM_PILOT_MINIO_USER es obligatorio}
      MINIO_ROOT_PASSWORD: ${PMGM_PILOT_MINIO_PASSWORD:?PMGM_PILOT_MINIO_PASSWORD es obligatorio}
    volumes:
      - pmgm_pilot_minio_data:/data
    networks: [pmgm_pilot_internal]

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on: [minio]
    restart: "no"
    environment:
      MINIO_ACCESS_KEY: ${PMGM_PILOT_MINIO_USER:?PMGM_PILOT_MINIO_USER es obligatorio}
      MINIO_SECRET_KEY: ${PMGM_PILOT_MINIO_PASSWORD:?PMGM_PILOT_MINIO_PASSWORD es obligatorio}
    entrypoint: >
      /bin/sh -c "
      until mc alias set pmgm http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do sleep 2; done;
      mc mb --ignore-existing pmgm/pmgm-documents;
      mc anonymous set none pmgm/pmgm-documents;
      exit 0;
      "
    networks: [pmgm_pilot_internal]

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - pmgm_pilot_clamav_db:/var/lib/clamav
    networks: [pmgm_pilot_internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${PMGM_PILOT_KEYCLOAK_ADMIN_USERNAME:?PMGM_PILOT_KEYCLOAK_ADMIN_USERNAME es obligatorio}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PMGM_PILOT_KEYCLOAK_ADMIN_PASSWORD:?PMGM_PILOT_KEYCLOAK_ADMIN_PASSWORD es obligatorio}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/pmgm_keycloak
      KC_DB_USERNAME: pmgm_app
      KC_DB_PASSWORD: ${PMGM_PILOT_DB_PASSWORD:?PMGM_PILOT_DB_PASSWORD es obligatorio}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${PMGM_PILOT_PUBLIC_URL:?PMGM_PILOT_PUBLIC_URL es obligatorio}/identity
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "true"
      PMGM_PILOT_PUBLIC_URL: ${PMGM_PILOT_PUBLIC_URL:?PMGM_PILOT_PUBLIC_URL es obligatorio}
      PMGM_PILOT_ADMIN_USERNAME: ${PMGM_PILOT_ADMIN_USERNAME:?PMGM_PILOT_ADMIN_USERNAME es obligatorio}
      PMGM_PILOT_ADMIN_EMAIL: ${PMGM_PILOT_ADMIN_EMAIL:?PMGM_PILOT_ADMIN_EMAIL es obligatorio}
      PMGM_PILOT_ADMIN_PASSWORD: ${PMGM_PILOT_ADMIN_PASSWORD:?PMGM_PILOT_ADMIN_PASSWORD es obligatorio}
    volumes:
      - ./keycloak/pmgm-pilot-realm.json:/opt/keycloak/data/import/pmgm-realm.json:ro
    networks: [pmgm_pilot_internal]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Database__ApplyMigrationsOnStartup: "true"
      DemoData__Enabled: "false"
      Authentication__Authority: http://keycloak:8080/identity/realms/pmgm
      Authentication__Audience: pmgm-api
      Authentication__RequireHttpsMetadata: "false"
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=pmgm;Username=pmgm_app;Password=${PMGM_PILOT_DB_PASSWORD:?PMGM_PILOT_DB_PASSWORD es obligatorio}
      DocumentStorage__ServiceUrl: http://minio:9000
      DocumentStorage__Region: us-east-1
      DocumentStorage__Bucket: pmgm-documents
      DocumentStorage__AccessKey: ${PMGM_PILOT_MINIO_USER:?PMGM_PILOT_MINIO_USER es obligatorio}
      DocumentStorage__SecretKey: ${PMGM_PILOT_MINIO_PASSWORD:?PMGM_PILOT_MINIO_PASSWORD es obligatorio}
      DocumentStorage__ForcePathStyle: "true"
      DocumentStorage__MaxUploadBytes: "52428800"
      DocumentMalware__Host: clamav
      DocumentMalware__Port: "3310"
      DocumentMalware__MaxStreamBytes: "52428800"
    networks: [pmgm_pilot_internal]

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_USE_MOCKS: "false"
        VITE_OIDC_AUTHORITY: ${PMGM_PILOT_PUBLIC_URL:?PMGM_PILOT_PUBLIC_URL es obligatorio}/identity/realms/pmgm
        VITE_OIDC_CLIENT_ID: pmgm-web
        VITE_OIDC_SCOPE: openid profile
        VITE_OIDC_ALLOW_HTTP_LOCAL: "false"
    restart: unless-stopped
    depends_on: [api, keycloak]
    networks: [pmgm_pilot_internal]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, keycloak]
    environment:
      PMGM_PILOT_HOSTNAME: ${PMGM_PILOT_HOSTNAME:?PMGM_PILOT_HOSTNAME es obligatorio}
    ports:
      - "${PMGM_PILOT_BIND_ADDRESS:-0.0.0.0}:${PMGM_PILOT_HTTP_PORT:-80}:80"
      - "${PMGM_PILOT_BIND_ADDRESS:-0.0.0.0}:${PMGM_PILOT_HTTPS_PORT:-443}:443"
    volumes:
      - ${PMGM_PILOT_CADDYFILE:-./caddy/Caddyfile.pilot}:/etc/caddy/Caddyfile:ro
      - pmgm_pilot_caddy_data:/data
      - pmgm_pilot_caddy_config:/config
    networks: [pmgm_pilot_internal]

networks:
  pmgm_pilot_internal:
    driver: bridge

volumes:
  pmgm_pilot_postgres_data:
  pmgm_pilot_minio_data:
  pmgm_pilot_clamav_db:
  pmgm_pilot_caddy_data:
  pmgm_pilot_caddy_config:
