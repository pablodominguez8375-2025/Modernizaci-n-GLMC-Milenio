services:
  postgres:
    image: postgres:17
    container_name: pmgm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pmgm
      POSTGRES_USER: pmgm_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmgm_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - pmgm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmgm_app -d pmgm"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: pmgm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pmgm_minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pmgm_minio_dev_secret_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pmgm_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: pmgm-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-pmgm_minio_dev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-pmgm_minio_dev_secret_change_me}
    entrypoint: >
      /bin/sh -c "
      until mc alias set pmgm http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do sleep 2; done;
      mc mb --ignore-existing pmgm/pmgm-documents;
      mc anonymous set none pmgm/pmgm-documents || true;
      exit 0;
      "

  clamav:
    image: clamav/clamav:1.4
    container_name: pmgm-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - pmgm_clamav_db:/var/lib/clamav

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: pmgm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrationsOnStartup: "true"
      Authentication__Authority: ${OIDC_AUTHORITY:-}
      Authentication__Audience: ${OIDC_API_AUDIENCE:-pmgm-api}
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=pmgm;Username=pmgm_app;Password=${POSTGRES_PASSWORD:-pmgm_dev_only}
      DocumentStorage__ServiceUrl: http://minio:9000
      DocumentStorage__Region: us-east-1
      DocumentStorage__Bucket: pmgm-documents
      DocumentStorage__AccessKey: ${MINIO_ACCESS_KEY:-pmgm_minio_dev}
      DocumentStorage__SecretKey: ${MINIO_SECRET_KEY:-pmgm_minio_dev_secret_change_me}
      DocumentStorage__ForcePathStyle: "true"
      DocumentStorage__MaxUploadBytes: ${DOCUMENT_MAX_UPLOAD_BYTES:-52428800}
      DocumentMalware__Host: clamav
      DocumentMalware__Port: "3310"
      DocumentMalware__MaxStreamBytes: ${DOCUMENT_MAX_UPLOAD_BYTES:-52428800}
    ports:
      - "8080:8080"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
        VITE_OIDC_AUTHORITY: ${OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
        VITE_OIDC_SCOPE: ${OIDC_SCOPE:-openid profile}
    container_name: pmgm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  pmgm_postgres_data:
  pmgm_minio_data:
  pmgm_clamav_db:
