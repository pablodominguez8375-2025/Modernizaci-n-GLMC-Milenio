# QA-only overlay for #604. Add last in docker compose -f order.
# The private host file is NEVER committed, printed, or stored in Drive.
# Its Authentication__Authority should match the existing healthy internal
# Keycloak metadata URL; the verified MasterIssuer remains canonical HTTPS.
services:
  # Operational QA only: never import CI's synthetic technical Master.
  # On existing realms --import-realm does not modify users; use exact
  # backed-up legacy role retirement and readback instead.
  keycloak:
    # Restricted local admin API; never publish through Caddy or network interfaces.
    # Compose normally MERGES port lists; replace the base 8180 publish
    # entirely, even if PMGM_QA_BIND_ADDRESS was set to 0.0.0.0.
    # !override is supported by the glmdch Compose >= 2.24.4.
    ports: !override
      - "127.0.0.1:18180:8080"
    volumes:
      - ./keycloak/pmgm-qa-public-realm.json:/opt/keycloak/data/import/pmgm-realm.json:ro
  api:
    # Docker Compose environment overrides env_file. The base QA file fixes
    # Authority to the legacy path without /identity. Pin the canonical
    # INTERNAL HTTPS-QA metadata route here as explicit environment.
    # MasterSubject and MasterIssuer still come only from root-only env_file.
    env_file:
      - ${PMGM_QA_MASTER_APP_ENV_FILE:?Root-only host master QA app configuration required}
    environment:
      Authentication__Authority: "http://keycloak:8080/identity/realms/pmgm"
