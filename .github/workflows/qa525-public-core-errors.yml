name: QA525 public core error boundary
on:
  pull_request:
    paths:
      - 'scripts/qa/operators/qa525-supervised-dual-entrypoint.py'
      - 'tests/test_qa525_public_core_errors.py'
      - '.github/workflows/qa525-public-core-errors.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/qa/operators/qa525-supervised-dual-entrypoint.py'
      - 'tests/test_qa525_public_core_errors.py'
      - '.github/workflows/qa525-public-core-errors.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test safe error boundary offline
        run: python3 -m unittest discover -s tests -p test_qa525_public_core_errors.py -v
