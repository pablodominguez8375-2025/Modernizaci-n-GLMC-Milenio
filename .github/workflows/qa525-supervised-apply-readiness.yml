name: QA525 supervised apply readiness contract
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/operators/qa525-current-apply-readiness.py'
      - 'tests/test_qa525_current_apply_readiness.py'
      - '.github/workflows/qa525-supervised-apply-readiness.yml'
permissions:
  contents: read
jobs:
  inspect-before-apply-no-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python syntax QA physical readiness only
        run: |
          python3 -m py_compile scripts/qa/operators/qa525-current-apply-readiness.py
          python3 -m py_compile tests/test_qa525_current_apply_readiness.py
      - name: Run offline rejection tests no SSH no Docker no secret
        run: python3 -m unittest discover -s tests -p test_qa525_current_apply_readiness.py -v
