name: QA525 isolated offhost dual database restore drill
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/operators/qa525-offhost-dual-restore-drill.py'
      - 'tests/test_qa525_offhost_dual_restore_drill.py'
      - '.github/workflows/qa525-offhost-restore-drill.yml'
permissions:
  contents: read
jobs:
  offline-restore-lab-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile isolated restore script and tests
        run: |
          python3 -m py_compile scripts/qa/operators/qa525-offhost-dual-restore-drill.py
          python3 -m py_compile tests/test_qa525_offhost_dual_restore_drill.py
      - name: Mock Docker + age with untrusted receipts and isolation rejection
        run: python3 -m unittest discover -s tests -p test_qa525_offhost_dual_restore_drill.py -v
