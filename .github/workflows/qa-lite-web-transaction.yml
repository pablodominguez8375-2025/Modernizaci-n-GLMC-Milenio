name: QA-AUTO-LIGERO reversible web transaction
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-lite-web-transaction.py'
      - 'tests/test_qa_lite_web_transaction.py'
      - '.github/workflows/qa-lite-web-transaction.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-lite-web-transaction.py'
      - 'tests/test_qa_lite_web_transaction.py'
      - '.github/workflows/qa-lite-web-transaction.yml'
permissions:
  contents: read
jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline tests — no Docker, secrets or host access
        run: |
          python3 -m py_compile scripts/qa/qa-lite-web-transaction.py tests/test_qa_lite_web_transaction.py
          python3 -m unittest discover -s tests -p 'test_qa_lite_web_transaction.py' -v
