name: QA525 local supervision exact-cut guard
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/operators/qa525-supervised-cut-approval.py'
      - 'tests/test_qa525_supervised_cut_approval.py'
      - '.github/workflows/qa525-supervised-cut-approval.yml'
permissions:
  contents: read
jobs:
  supervised-cut-no-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile local cut matcher
        run: |
          python3 -m py_compile scripts/qa/operators/qa525-supervised-cut-approval.py
          python3 -m py_compile tests/test_qa525_supervised_cut_approval.py
      - name: Reject old release and unsolicited apply requests
        run: python3 -m unittest discover -s tests -p test_qa525_supervised_cut_approval.py -v
