name: QA525 custody regression
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile custody validators
        run: python3 -m py_compile scripts/qa/qa525-launcher-custody-chain.py scripts/qa/qa525-launcher-modern-journal.py
      - name: Execute custody regression suites
        run: |
          python3 -m unittest discover -s tests -p 'test_qa525_launcher_custody_chain.py' -v
          python3 -m unittest discover -s tests -p 'test_qa525_launcher_modern_journal.py' -v
