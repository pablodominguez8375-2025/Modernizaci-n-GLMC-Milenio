name: QA candidate acquisition orchestration tests
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-acquire-candidate.py'
      - 'tests/test_qa_acquire_candidate.py'
      - 'docs/qa/QA-AGENT-ACQUISITION.md'
      - '.github/workflows/qa-candidate-acquisition.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-acquire-candidate.py'
      - 'tests/test_qa_acquire_candidate.py'
      - '.github/workflows/qa-candidate-acquisition.yml'
permissions:
  contents: read
jobs:
  acquisition:
    name: Offline QA candidate acquisition tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check isolation, atomicity and dev-head races
        run: |
          python3 -m py_compile scripts/qa/qa-acquire-candidate.py tests/test_qa_acquire_candidate.py
          python3 -m unittest discover -s tests -p test_qa_acquire_candidate.py -v
