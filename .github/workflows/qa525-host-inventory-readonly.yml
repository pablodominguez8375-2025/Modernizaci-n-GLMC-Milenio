name: QA525 glmdch read-only runtime inventory
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/operators/qa525-host-inventory-readonly.py'
      - 'tests/test_qa525_host_inventory_readonly.py'
      - '.github/workflows/qa525-host-inventory-readonly.yml'
permissions:
  contents: read
jobs:
  inventory-is-no-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile read-only glmdch inventory
        run: |
          python3 -m py_compile scripts/qa/operators/qa525-host-inventory-readonly.py
          python3 -m py_compile tests/test_qa525_host_inventory_readonly.py
      - name: Test seven-service inventory and redaction
        run: python3 -m unittest discover -s tests -p test_qa525_host_inventory_readonly.py -v
