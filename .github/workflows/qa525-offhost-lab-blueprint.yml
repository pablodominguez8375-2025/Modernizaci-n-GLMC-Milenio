name: QA525 offhost isolated restore-lab blueprint
on:
  pull_request:
    branches: [dev]
    paths:
      - 'infrastructure/qa525/restore-lab.compose.json'
      - 'scripts/qa/operators/qa525-restore-lab-blueprint-guard.py'
      - 'tests/test_qa525_restore_lab_blueprint_guard.py'
      - '.github/workflows/qa525-offhost-lab-blueprint.yml'
permissions:
  contents: read
jobs:
  compose-is-inert-and-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile no-Docker lab guard
        run: |
          python3 -m py_compile scripts/qa/operators/qa525-restore-lab-blueprint-guard.py
          python3 -m py_compile tests/test_qa525_restore_lab_blueprint_guard.py
      - name: Validate no network, host mounts, or unpinned image
        run: python3 -m unittest discover -s tests -p test_qa525_restore_lab_blueprint_guard.py -v
