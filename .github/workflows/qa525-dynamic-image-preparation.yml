name: QA525 dynamic signed API and WEB image preparation
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/operators/qa525-current-image-preparation.py'
      - 'tests/test_qa525_current_image_preparation.py'
      - '.github/workflows/qa525-dynamic-image-preparation.yml'
permissions:
  contents: read
jobs:
  no-deployment-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile non-deploying QA525 API WEB preparation
        run: |
          python3 -m py_compile scripts/qa/operators/qa525-current-image-preparation.py
          python3 -m py_compile tests/test_qa525_current_image_preparation.py
      - name: Prove signature, SHA, host, snapshot and no-apply rejection paths
        run: python3 -m unittest discover -s tests -p test_qa525_current_image_preparation.py -v
