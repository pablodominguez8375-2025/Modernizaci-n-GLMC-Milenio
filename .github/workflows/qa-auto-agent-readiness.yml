name: QA auto-agent readiness contract
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-agent-readiness.py'
      - 'tests/test_qa_agent_readiness.py'
      - 'scripts/qa/qa525-vnext-*.py'
      - 'tests/test_qa525_vnext_*.py'
      - 'docs/qa/QA-AUTO-DEPLOY-READINESS.md'
      - '.github/workflows/qa-auto-agent-readiness.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-agent-readiness.py'
      - 'tests/test_qa_agent_readiness.py'
      - 'scripts/qa/qa525-vnext-*.py'
      - 'tests/test_qa525_vnext_*.py'
      - '.github/workflows/qa-auto-agent-readiness.yml'
permissions:
  contents: read
jobs:
  readiness:
    name: Offline read-only readiness tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install restic for hermetic G6 v2 integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends restic
          restic version
      - name: Syntax and safety contract
        env:
          QA525_REQUIRE_RESTIC: "1"
        run: |
          python3 -m py_compile scripts/qa/qa-agent-readiness.py tests/test_qa_agent_readiness.py
          python3 -m unittest discover -s tests -p test_qa_agent_readiness.py -v
      - name: Real offline Sigstore verification of the authenticity port (network denied, no SKIP)
        run: |
          set -euo pipefail
          command -v gh && gh --version | head -1
          command -v ssh-keygen
          ls tests/fixtures/sigstore-offline/sigstore-js-2.1.0.tgz \
             tests/fixtures/sigstore-offline/sigstore-js-2.1.0-bundle.json \
             tests/fixtures/sigstore-offline/trusted-root-public-good.jsonl
          # A fresh network namespace (loopback down, no route): any attempt by gh to reach the network fails.
          sudo unshare -n -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            env PATH="$PATH" python3 -m unittest -v tests.test_qa525_vnext_root_authenticity.RealGhOfflineTests 2>&1 | tee /tmp/real-gh-offline.log
          grep -q "test_positive_real_attestation_verifies_offline .* ok$" /tmp/real-gh-offline.log
          grep -q "test_renamed_or_reused_repository_name_is_not_enough_without_the_stable_id .* ok$" /tmp/real-gh-offline.log
          if grep -qi "skipped" /tmp/real-gh-offline.log; then echo "authenticity suite was skipped"; exit 1; fi
          grep -q "^Ran 6 tests" /tmp/real-gh-offline.log
