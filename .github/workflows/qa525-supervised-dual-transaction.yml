name: QA525 supervised API WEB dual transaction (hermetic)

on:
  push:
    branches: [dev, "feature/**", "fix/**"]
    paths:
      - "scripts/qa/operators/qa525-supervised-dual-transaction.py"
      - "tests/test_qa525_supervised_dual_transaction.py"
      - ".github/workflows/qa525-supervised-dual-transaction.yml"
  pull_request:
    branches: [dev]
    paths:
      - "scripts/qa/operators/qa525-supervised-dual-transaction.py"
      - "tests/test_qa525_supervised_dual_transaction.py"
      - ".github/workflows/qa525-supervised-dual-transaction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile trusted core and test module
        run: |
          python -m py_compile scripts/qa/operators/qa525-supervised-dual-transaction.py
          python -m py_compile tests/test_qa525_supervised_dual_transaction.py
      - name: All dual transaction regressions, fake Docker only
        run: python -m unittest discover -s tests -p 'test_qa525_supervised_dual_transaction.py' -v
      - name: Ensure no executable deployment entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("scripts/qa/operators/qa525-supervised-dual-transaction.py").read_text()
          assert 'NO_CLI_TRUSTED_HOST_WRAPPER_REQUIRED' in src
          assert '"--no-deps"' in src and '"--no-build"' in src
          assert '"--force-recreate"' in src
          assert 'rollback' in src.lower()
          PY
