name: QA525 supervised API WEB dual transaction (hermetic)

on:
  push:
    branches: [dev, "feature/**", "fix/**"]
    paths:
      - "scripts/qa/operators/qa525-supervised-dual-transaction.py"
      - "scripts/qa/operators/qa525-supervised-dual-entrypoint.py"
      - "tests/test_qa525_supervised_dual_transaction.py"
      - "tests/test_qa525_supervised_dual_entrypoint.py"
      - "tests/test_qa525_member_history_schema_gate.py"
      - "scripts/qa/operators/qa525-member-history-schema-gate.py"
      - "scripts/qa/operators/qa525-post-db-readonly.py"
      - "tests/test_qa525_post_db_readonly.py"
      - "scripts/qa/operators/qa525-update.py"
      - "scripts/qa/operators/qa525-support00-*.py"
      - "scripts/qa/operators/support00-migrator/**"
      - "tests/test_qa525_support00_schema.py"
      - "tests/test_qa525_update_automation.py"
      - "scripts/qa/operators/qa525-launcher-upgrade-inspect.py"
      - "tests/test_qa525_launcher_upgrade_inspect.py"
      - "scripts/qa/operators/qa525-launcher-signed-preflight.py"
      - "tests/test_qa525_launcher_signed_preflight.py"
      - "scripts/qa/operators/qa525-launcher-replacement-contract.py"
      - "tests/test_qa525_launcher_replacement_contract.py"
      - "scripts/qa/operators/qa525-launcher-atomic-sandbox.py"
      - "tests/test_qa525_launcher_atomic_sandbox.py"
      - "backend/tests/PMGM.Api.Tests/Integration/SupportViewAsPostgreSqlTests.cs"
      - ".github/workflows/qa525-supervised-dual-transaction.yml"
  pull_request:
    branches: [dev]
    paths:
      - "scripts/qa/operators/qa525-supervised-dual-transaction.py"
      - "scripts/qa/operators/qa525-supervised-dual-entrypoint.py"
      - "tests/test_qa525_supervised_dual_transaction.py"
      - "tests/test_qa525_supervised_dual_entrypoint.py"
      - "tests/test_qa525_member_history_schema_gate.py"
      - "scripts/qa/operators/qa525-member-history-schema-gate.py"
      - "scripts/qa/operators/qa525-post-db-readonly.py"
      - "tests/test_qa525_post_db_readonly.py"
      - "scripts/qa/operators/qa525-update.py"
      - "scripts/qa/operators/qa525-support00-*.py"
      - "scripts/qa/operators/support00-migrator/**"
      - "tests/test_qa525_support00_schema.py"
      - "tests/test_qa525_update_automation.py"
      - "scripts/qa/operators/qa525-launcher-upgrade-inspect.py"
      - "tests/test_qa525_launcher_upgrade_inspect.py"
      - "scripts/qa/operators/qa525-launcher-signed-preflight.py"
      - "tests/test_qa525_launcher_signed_preflight.py"
      - "scripts/qa/operators/qa525-launcher-replacement-contract.py"
      - "tests/test_qa525_launcher_replacement_contract.py"
      - "scripts/qa/operators/qa525-launcher-atomic-sandbox.py"
      - "tests/test_qa525_launcher_atomic_sandbox.py"
      - "backend/tests/PMGM.Api.Tests/Integration/SupportViewAsPostgreSqlTests.cs"
      - ".github/workflows/qa525-supervised-dual-transaction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile trusted core and test module
        run: |
          python -m py_compile scripts/qa/operators/qa525-supervised-dual-transaction.py
          python -m py_compile scripts/qa/operators/qa525-supervised-dual-entrypoint.py
          python -m py_compile tests/test_qa525_supervised_dual_transaction.py
          python -m py_compile tests/test_qa525_supervised_dual_entrypoint.py
          python -m py_compile scripts/qa/operators/qa525-member-history-schema-gate.py
          python -m py_compile tests/test_qa525_member_history_schema_gate.py
          python -m py_compile scripts/qa/operators/qa525-post-db-readonly.py
          python -m py_compile tests/test_qa525_post_db_readonly.py
          python -m py_compile scripts/qa/operators/qa525-update.py
          python -m py_compile scripts/qa/operators/qa525-support00-migration.py
          python -m py_compile scripts/qa/operators/qa525-support00-schema-gate.py
          python -m py_compile scripts/qa/operators/qa525-support00-post-db-readonly.py
          python -m py_compile tests/test_qa525_support00_schema.py
          python -m py_compile tests/test_qa525_update_automation.py
          python -m py_compile scripts/qa/operators/qa525-launcher-upgrade-inspect.py
          python -m py_compile tests/test_qa525_launcher_upgrade_inspect.py
          python -m py_compile scripts/qa/operators/qa525-launcher-signed-preflight.py
          python -m py_compile tests/test_qa525_launcher_signed_preflight.py
          python -m py_compile scripts/qa/operators/qa525-launcher-replacement-contract.py
          python -m py_compile tests/test_qa525_launcher_replacement_contract.py
          python -m py_compile scripts/qa/operators/qa525-launcher-atomic-sandbox.py
          python -m py_compile tests/test_qa525_launcher_atomic_sandbox.py
      - name: All dual transaction regressions, fake Docker only
        run: python -m unittest discover -s tests -p 'test_qa525_supervised_dual_transaction.py' -v
      - name: Offline review, migration and supervision regressions
        run: python -m unittest discover -s tests -p 'test_qa525_supervised_dual_entrypoint.py' -v
      - name: Verified PR801 additive migration contract (no database access)
        run: python -m unittest discover -s tests -p 'test_qa525_member_history_schema_gate.py' -v
      - name: Post-DB 99 migration checkpoint (fake Docker, NO writes)
        run: python -m unittest discover -s tests -p 'test_qa525_post_db_readonly.py' -v
      - name: Exact EF100 and support00 catalog contract (fake Docker)
        run: python -m unittest discover -s tests -p 'test_qa525_support00_schema.py' -v
      - name: Reusable controller, replay, quota redaction and Compose history
        run: python -m unittest discover -s tests -p 'test_qa525_update_automation.py' -v
      - name: Read-only launcher inspection adversarial tests, no host access
        run: python -m unittest discover -s tests -p 'test_qa525_launcher_upgrade_inspect.py' -v
      - name: Signed-release launcher preflight regressions, fake host and signature
        run: python -m unittest discover -s tests -p 'test_qa525_launcher_signed_preflight.py' -v
      - name: QA525 launcher approved cut and crash-state policy (no host, no writes)
        run: python -m unittest discover -s tests -p 'test_qa525_launcher_replacement_contract.py' -v
      - name: QA525 launcher sandbox process-death and receipt regressions (no host)
        run: python -m unittest discover -s tests -p 'test_qa525_launcher_atomic_sandbox.py' -v
      - name: Ensure no unattended deployment entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("scripts/qa/operators/qa525-supervised-dual-transaction.py").read_text()
          assert 'NO_CLI_TRUSTED_HOST_WRAPPER_REQUIRED' in src
          assert '"--no-deps"' in src and '"--no-build"' in src
          assert '"--force-recreate"' in src
          assert 'rollback' in src.lower()
          entry=Path("scripts/qa/operators/qa525-supervised-dual-entrypoint.py").read_text()
          assert 'ONLY_EXPLICIT_SUPERVISION_ALLOWED' in entry
          assert 'approved_review' in entry and 'validate_g6' in entry
          assert 'approval.validate' in entry
          assert 'signed.verify_current' in entry
          assert 'scan_migrations' in entry
          PY
