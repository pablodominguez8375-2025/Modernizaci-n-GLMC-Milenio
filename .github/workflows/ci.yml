name: PMGM CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pmgm_ci
          POSTGRES_USER: pmgm
          POSTGRES_PASSWORD: pmgm_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmgm -d pmgm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PMGM_TEST_POSTGRES: Host=localhost;Port=5432;Database=pmgm_ci;Username=pmgm;Password=pmgm_ci_only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Privacy gate — Ley 21.719
        run: python3 tests/privacy_gate.py

      - name: Data classification gate
        run: python3 tests/data_classification_gate.py

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore backend/src/PMGM.Api/PMGM.Api.csproj

      - name: Build API
        run: dotnet build backend/src/PMGM.Api/PMGM.Api.csproj --configuration Release --no-restore

      - name: Restore tests
        run: dotnet restore backend/tests/PMGM.Api.Tests/PMGM.Api.Tests.csproj

      - name: Test unit and PostgreSQL integration
        run: dotnet test backend/tests/PMGM.Api.Tests/PMGM.Api.Tests.csproj --configuration Release --no-restore
