name: PMGM CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pmgm_ci
          POSTGRES_USER: pmgm
          POSTGRES_PASSWORD: pmgm_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmgm -d pmgm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PMGM_TEST_POSTGRES: Host=localhost;Port=5432;Database=pmgm_ci;Username=pmgm;Password=pmgm_ci_only
      PMGM_TEST_S3_URL: http://127.0.0.1:9000
      PMGM_TEST_S3_ACCESS_KEY: pmgm_minio_ci
      PMGM_TEST_S3_SECRET_KEY: pmgm_minio_ci_secret_change_me
      PMGM_TEST_S3_BUCKET: pmgm-documents
      PMGM_TEST_CLAMAV_HOST: 127.0.0.1
      PMGM_TEST_CLAMAV_PORT: 3310

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Privacy gate — Ley 21.719
        run: python3 tests/privacy_gate.py

      - name: Data classification gate
        run: python3 tests/data_classification_gate.py

      - name: Migration safety gate
        run: python3 tests/migration_gate.py

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start private MinIO for S3 integration
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name pmgm-minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$PMGM_TEST_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$PMGM_TEST_S3_SECRET_KEY" \
            quay.io/minio/minio:latest server /data

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            docker logs pmgm-minio-ci
            exit 1
          fi

          docker run --rm \
            --network host \
            --entrypoint /bin/sh \
            minio/mc:latest \
            -c "mc alias set pmgm '$PMGM_TEST_S3_URL' '$PMGM_TEST_S3_ACCESS_KEY' '$PMGM_TEST_S3_SECRET_KEY' && mc mb --ignore-existing pmgm/$PMGM_TEST_S3_BUCKET && mc anonymous set none pmgm/$PMGM_TEST_S3_BUCKET"

      - name: Start ClamAV for malware integration
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name pmgm-clamav-ci \
            -p 3310:3310 \
            clamav/clamav:1.4

          ready=false
          for attempt in $(seq 1 60); do
            if python3 - <<'PY'
          import socket
          try:
              with socket.create_connection(("127.0.0.1", 3310), timeout=1) as connection:
                  connection.sendall(b"zPING\0")
                  response = connection.recv(64)
              raise SystemExit(0 if b"PONG" in response else 1)
          except OSError:
              raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            docker logs pmgm-clamav-ci
            exit 1
          fi

      - name: Restore API
        run: dotnet restore backend/src/PMGM.Api/PMGM.Api.csproj

      - name: Build API
        run: dotnet build backend/src/PMGM.Api/PMGM.Api.csproj --configuration Release --no-restore

      - name: Restore tests
        run: dotnet restore backend/tests/PMGM.Api.Tests/PMGM.Api.Tests.csproj

      - name: Test unit, PostgreSQL, S3 and ClamAV integration
        run: dotnet test backend/tests/PMGM.Api.Tests/PMGM.Api.Tests.csproj --configuration Release --no-restore

      - name: Stop ClamAV
        if: always()
        run: docker rm -f pmgm-clamav-ci >/dev/null 2>&1 || true

      - name: Stop MinIO
        if: always()
        run: docker rm -f pmgm-minio-ci >/dev/null 2>&1 || true

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test OIDC session and API boundary
        run: npm test --prefix frontend

      - name: Build frontend container
        run: docker build --build-arg VITE_USE_MOCKS=true -t pmgm-web-ci frontend

      - name: Validate Nginx configuration
        shell: bash
        run: |
          set -euo pipefail
          docker network create pmgm-nginx-ci
          trap 'docker rm -f pmgm-api-placeholder >/dev/null 2>&1 || true; docker network rm pmgm-nginx-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name pmgm-api-placeholder --network pmgm-nginx-ci --network-alias api nginx:stable-alpine
          docker run --rm --network pmgm-nginx-ci pmgm-web-ci nginx -t

  infrastructure-validate:
    name: Infrastructure configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f infrastructure/docker-compose.dev.yml config
