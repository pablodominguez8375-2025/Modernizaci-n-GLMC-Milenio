name: PMGM Showcase Demo

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: read
  id-token: write

# PR validation must never cancel an in-flight deployment.
# Each source keeps an independent deployment group.
concurrency:
  group: pmgm-showcase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: Build showcase for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact delivery SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build public testing showcase
        env:
          VITE_USE_MOCKS: 'true'
          VITE_BASE_PATH: '/Modernizaci-n-GLMC-Milenio/'
          VITE_API_BASE_URL: ''
          VITE_OIDC_AUTHORITY: ''
          VITE_OIDC_CLIENT_ID: ''
          VITE_SHOWCASE_SHA: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha || github.sha }}
          VITE_SHOWCASE_CHANNEL: 'post-rc-public-showcase'
        run: npm run build --prefix frontend

      - name: Validate generated showcase
        shell: bash
        env:
          EXPECTED_SHOWCASE_SHA: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          grep -q '/Modernizaci-n-GLMC-Milenio/assets/' frontend/dist/index.html
          grep -R -q "${EXPECTED_SHOWCASE_SHA:0:7}" frontend/dist
          if grep -R -E '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]+|sk-proj-[A-Za-z0-9_-]+|Authorization: Bearer)' frontend/dist; then
            echo 'Se detectó un patrón sensible en el showcase generado.' >&2
            exit 1
          fi
          printf 'SHOWCASE BUILD OK — SHA %s\n' "${EXPECTED_SHOWCASE_SHA:0:7}"

      - name: Capture responsive visual evidence
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No se encontró un navegador Chromium/Chrome para generar evidencia visual.' >&2
            exit 1
          fi

          SITE_ROOT="$(mktemp -d)"
          mkdir -p "$SITE_ROOT/Modernizaci-n-GLMC-Milenio" frontend/visual-evidence
          cp -R frontend/dist/. "$SITE_ROOT/Modernizaci-n-GLMC-Milenio/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$SITE_ROOT" >/tmp/pmgm-showcase-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$SITE_ROOT"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/Modernizaci-n-GLMC-Milenio/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/pmgm-showcase-http.log >&2 || true
              exit 1
            fi
            sleep 0.5
          done

          capture() {
            local size="$1"
            local file="$2"
            "$BROWSER" \
              --headless=new \
              --disable-gpu \
              --no-sandbox \
              --hide-scrollbars \
              --virtual-time-budget=5000 \
              --window-size="$size" \
              --screenshot="frontend/visual-evidence/$file" \
              http://127.0.0.1:4173/Modernizaci-n-GLMC-Milenio/
            test -s "frontend/visual-evidence/$file"
          }

          # Full acceptance matrix for the initial member view.
          capture 360,800 mi-ficha-360x800.png
          capture 390,844 mi-ficha-390x844.png
          capture 768,1024 mi-ficha-768x1024.png
          capture 1024,768 mi-ficha-1024x768.png
          capture 1366,768 mi-ficha-1366x768.png
          capture 1440,900 mi-ficha-1440x900.png
          capture 1920,1080 mi-ficha-1920x1080.png

          # Representative module matrix: browser automation changes QA profile and module exactly as a user would.
          node .github/scripts/capture-showcase-views.mjs \
            "$BROWSER" \
            http://127.0.0.1:4173/Modernizaci-n-GLMC-Milenio/ \
            frontend/visual-evidence

          test "$(find frontend/visual-evidence -maxdepth 1 -name '*.png' | wc -l)" -ge 21
          printf 'RESPONSIVE VISUAL EVIDENCE OK\n'

      - name: Upload responsive visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: pmgm-responsive-visual-evidence
          path: frontend/visual-evidence/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Inspect Pages and deployment environment
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_get() {
            local path="$1"
            local output="$2"
            local code
            code="$(curl -sS -L               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               -o "$output"               -w '%{http_code}'               "https://api.github.com/repos/$GITHUB_REPOSITORY/$path")"
            printf '%s\n' "$code"
          }

          pages_code="$(api_get pages /tmp/pages.json)"
          env_code="$(api_get environments/github-pages /tmp/pages-environment.json)"
          policies_code="$(api_get environments/github-pages/deployment-branch-policies?per_page=100 /tmp/pages-policies.json)"
          deployments_code="$(api_get 'deployments?environment=github-pages&per_page=5' /tmp/pages-deployments.json)"

          PAGES_CODE="$pages_code"           ENV_CODE="$env_code"           POLICIES_CODE="$policies_code"           DEPLOYMENTS_CODE="$deployments_code"           python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return None

          pages = load("/tmp/pages.json")
          environment = load("/tmp/pages-environment.json")
          policies = load("/tmp/pages-policies.json")
          deployments = load("/tmp/pages-deployments.json")

          print("PAGES_DIAGNOSTIC")
          print("pages_http=", os.environ["PAGES_CODE"])
          if isinstance(pages, dict):
              source = pages.get("source") or {}
              print("pages_status=", pages.get("status"))
              print("pages_build_type=", pages.get("build_type"))
              print("pages_html_url=", pages.get("html_url"))
              print("pages_source_branch=", source.get("branch"))
              print("pages_source_path=", source.get("path"))
          else:
              print("pages_response=", pages)

          print("environment_http=", os.environ["ENV_CODE"])
          if isinstance(environment, dict):
              print("environment_name=", environment.get("name"))
              print("environment_branch_policy=", environment.get("deployment_branch_policy"))
              rules = environment.get("protection_rules") or []
              print("environment_protection_rules=", [rule.get("type") for rule in rules if isinstance(rule, dict)])
          else:
              print("environment_response=", environment)

          print("branch_policies_http=", os.environ["POLICIES_CODE"])
          if isinstance(policies, dict):
              branches = [
                  item.get("name")
                  for item in policies.get("branch_policies", [])
                  if isinstance(item, dict)
              ]
              print("allowed_deployment_branches=", branches)
          else:
              print("branch_policies_response=", policies)

          print("deployments_http=", os.environ["DEPLOYMENTS_CODE"])
          if isinstance(deployments, list):
              for item in deployments[:5]:
                  if not isinstance(item, dict):
                      continue
                  print(
                      "deployment=",
                      {
                          "id": item.get("id"),
                          "ref": item.get("ref"),
                          "sha": item.get("sha"),
                          "environment": item.get("environment"),
                          "created_at": item.get("created_at"),
                      },
                  )
          else:
              print("deployments_response=", deployments)
          PY

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    name: Deploy testing showcase
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v5
