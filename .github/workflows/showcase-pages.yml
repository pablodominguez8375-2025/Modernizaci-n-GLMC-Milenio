name: PMGM Showcase Demo

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/showcase-pages.yml'
      - 'docs/qa/PMGM-GITHUB-PAGES-SHOWCASE.md'
  pull_request:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/showcase-pages.yml'
      - 'docs/qa/PMGM-GITHUB-PAGES-SHOWCASE.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR validation must never cancel an in-flight deployment from dev.
# Each PR gets its own concurrency group; dev keeps a stable deployment group.
concurrency:
  group: pmgm-showcase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build showcase for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build public testing showcase
        env:
          VITE_USE_MOCKS: 'true'
          VITE_BASE_PATH: '/Modernizaci-n-GLMC-Milenio/'
          VITE_API_BASE_URL: ''
          VITE_OIDC_AUTHORITY: ''
          VITE_OIDC_CLIENT_ID: ''
        run: npm run build --prefix frontend

      - name: Validate generated showcase
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          grep -q '/Modernizaci-n-GLMC-Milenio/assets/' frontend/dist/index.html
          if grep -R -E '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]+|sk-proj-[A-Za-z0-9_-]+|Authorization: Bearer)' frontend/dist; then
            echo 'Se detectó un patrón sensible en el showcase generado.' >&2
            exit 1
          fi
          printf 'SHOWCASE BUILD OK\n'

      - name: Capture responsive visual evidence
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No se encontró un navegador Chromium/Chrome para generar evidencia visual.' >&2
            exit 1
          fi

          SITE_ROOT="$(mktemp -d)"
          mkdir -p "$SITE_ROOT/Modernizaci-n-GLMC-Milenio" frontend/visual-evidence
          cp -R frontend/dist/. "$SITE_ROOT/Modernizaci-n-GLMC-Milenio/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$SITE_ROOT" >/tmp/pmgm-showcase-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$SITE_ROOT"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/Modernizaci-n-GLMC-Milenio/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/pmgm-showcase-http.log >&2 || true
              exit 1
            fi
            sleep 0.5
          done

          capture() {
            local size="$1"
            local file="$2"
            "$BROWSER" \
              --headless=new \
              --disable-gpu \
              --no-sandbox \
              --hide-scrollbars \
              --virtual-time-budget=5000 \
              --window-size="$size" \
              --screenshot="frontend/visual-evidence/$file" \
              http://127.0.0.1:4173/Modernizaci-n-GLMC-Milenio/
            test -s "frontend/visual-evidence/$file"
          }

          capture 390,844 mi-ficha-390x844.png
          capture 768,1024 mi-ficha-768x1024.png
          capture 1440,900 mi-ficha-1440x900.png
          printf 'RESPONSIVE VISUAL EVIDENCE OK\n'

      - name: Upload responsive visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: pmgm-responsive-visual-evidence
          path: frontend/visual-evidence/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy testing showcase
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v5
