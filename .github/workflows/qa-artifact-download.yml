name: QA artifact read-only download contract
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-artifact-download.py'
      - 'tests/test_qa_artifact_download.py'
      - 'docs/qa/QA-ARTIFACT-READONLY-DELIVERY.md'
      - '.github/workflows/qa-artifact-download.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-artifact-download.py'
      - 'tests/test_qa_artifact_download.py'
      - '.github/workflows/qa-artifact-download.yml'
permissions:
  contents: read
jobs:
  downloader:
    name: Offline artifact download security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Syntax and read-only token safety tests
        run: |
          python3 -m py_compile scripts/qa/qa-artifact-download.py tests/test_qa_artifact_download.py
          python3 -m unittest discover -s tests -p test_qa_artifact_download.py -v
