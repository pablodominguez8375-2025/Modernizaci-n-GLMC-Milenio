name: QA agent read-only planner and timer contract
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-agent-plan.py'
      - 'tests/test_qa_agent_plan.py'
      - 'tests/test_qa_agent_plan_units.py'
      - 'infrastructure/systemd/pmgm-qa-agent-plan.*'
      - 'docs/qa/QA-AGENT-PLANNER-SYSTEMD.md'
      - '.github/workflows/qa-agent-planner.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/qa/qa-agent-plan.py'
      - 'tests/test_qa_agent_plan.py'
      - 'tests/test_qa_agent_plan_units.py'
      - 'infrastructure/systemd/pmgm-qa-agent-plan.*'
      - '.github/workflows/qa-agent-planner.yml'
permissions:
  contents: read
jobs:
  plan:
    name: Offline planner and service isolation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate planner and security contract
        run: |
          python3 -m py_compile scripts/qa/qa-agent-plan.py tests/test_qa_agent_plan.py tests/test_qa_agent_plan_units.py
          python3 -m unittest discover -s tests -p 'test_qa_agent_plan*.py' -v
