name: Apply ceremony eligibility consistency fix

on:
  push:
    branches:
      - fix/ceremony-eligibility
    paths:
      - scripts/apply-ceremony-eligibility-fix.py
      - .github/workflows/apply-ceremony-eligibility-fix.yml
  pull_request:
    branches:
      - dev
    paths:
      - scripts/apply-ceremony-eligibility-fix.py
      - .github/workflows/apply-ceremony-eligibility-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ceremony-eligibility

      - name: Apply source and regression-test patch
        run: python3 scripts/apply-ceremony-eligibility-fix.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/PMGM.Api/Modules/Ceremonies/CeremonyEndpoints.cs
          git add backend/src/PMGM.Api/Modules/InstitutionalProjections/CeremonyReviewQueueEndpoints.cs
          git add backend/tests/PMGM.Api.Tests/Integration/PostgreSqlHttpWorkflowTests.cs
          git diff --cached --quiet && exit 0
          git commit -m "fix(ceremonies): align eligibility with grand master approval"
          git push origin HEAD:fix/ceremony-eligibility
