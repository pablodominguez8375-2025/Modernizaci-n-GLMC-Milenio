name: QA525 reversible transaction receipt contract
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/operators/qa525-reversible-transaction-contract.py'
      - 'tests/test_qa525_reversible_transaction_contract.py'
      - '.github/workflows/qa525-reversible-contract.yml'
permissions:
  contents: read
jobs:
  reversible-receipt-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile read-only receipt validator and tests
        run: |
          python3 -m py_compile scripts/qa/operators/qa525-reversible-transaction-contract.py
          python3 -m py_compile tests/test_qa525_reversible_transaction_contract.py
      - name: Test backup, rollback and fail-closed receipt boundaries
        run: |
          python3 -m unittest discover -s tests -p test_qa525_reversible_transaction_contract.py -v
