name: QA525 current signed release contract
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/qa/qa525-current-release-gate.py'
      - 'scripts/qa/qa-agent-readiness.py'
      - 'tests/test_qa525_current_release_gate.py'
      - '.github/workflows/qa525-current-release-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile read-only release gate
        run: python3 -m py_compile scripts/qa/qa525-current-release-gate.py tests/test_qa525_current_release_gate.py
      - name: Verify fail-closed exact-head release contracts
        run: python3 -m unittest discover -s tests -p test_qa525_current_release_gate.py -v
